name: integrated build
on:
  push:
    branches: [webos5-upstream]
  pull_request:
    branches: [webos5-upstream]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned upstream launcher and test dependencies
        run: |
          git clone https://github.com/partridgeworks/webos-launcher app
          git -C app checkout 1e2c39b9a988ceb1b258e40e3592bda84a2aa076
          npm ci --prefix app
          npm ci --prefix compat/tests
          npx --prefix compat/tests playwright install --with-deps chromium
      - name: Pinned public upstream release assets
        run: python3 compat/fetch-upstream-release.py
      - name: Build all upstream layers and accepted presentation
        run: python3 compat/build.py
      - name: Audit public package
        run: |
          python3 compat/verify-package.py app/build/local.lumen.upstreamtrial_1.1.5_all.ipk --output .trial-evidence/public-package.json
          cd app/build
          sha256sum local.lumen.upstreamtrial_1.1.5_all.ipk > SHA256SUMS.txt
      - name: Upstream and safe-wake checks
        run: |
          python3 -B -m unittest discover -s tools/test -p 'test_*.py' -v
          node tools/test/startup.test.cjs
          node compat/tests/wake-helper-tests.mjs
      - name: Home, Inputs and Control Center checks
        run: |
          python3 -m http.server 5191 --bind 127.0.0.1 --directory app/dist > /tmp/lumen-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5191/ > /dev/null; then break; fi
            sleep 1
          done
          TRIAL_URL=http://127.0.0.1:5191 node compat/tests/panel-tests.mjs
          TRIAL_URL=http://127.0.0.1:5191 node compat/tests/grid-edit-tests.mjs
          TRIAL_URL=http://127.0.0.1:5191 node compat/tests/upstream-integration-tests.mjs
      - name: Focus sound and cleanup checks
        run: |
          npm --prefix app run dev -- --host 127.0.0.1 --port 5193 > /tmp/lumen-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5193/ > /dev/null; then break; fi
            sleep 1
          done
          TRIAL_URL=http://127.0.0.1:5193 node compat/tests/navigation-sound-tests.mjs
      - name: Keep audited public build
        uses: actions/upload-artifact@v4
        with:
          name: lumen-webos5-integrated
          include-hidden-files: true
          path: |
            app/build/*.ipk
            app/build/SHA256SUMS.txt
            .trial-evidence/public-package.json
          retention-days: 14
      - name: Keep synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-test-evidence
          include-hidden-files: true
          path: .trial-evidence/
          retention-days: 14
